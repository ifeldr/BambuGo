name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Versione Swift
        run: swift --version

      - name: Imposta la versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Compila
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Crea lo zip
        run: |
          cd build
          ditto -c -k --keepParent BambuGo.app BambuGo.zip
          lipo -info BambuGo.app/Contents/MacOS/BambuGo

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: BambuGo
          path: build/BambuGo.zip

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/BambuGo.zip
          generate_release_notes: true
