name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da pubblicare come release (es. 1.0.0). Vuoto = solo build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Versione Swift
        run: swift --version

      - name: Determina la versione
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Imposta la versione
        if: steps.version.outputs.value != ''
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Compila
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Crea lo zip
        run: |
          cd build
          ditto -c -k --keepParent BambuGo.app BambuGo.zip
          lipo -info BambuGo.app/Contents/MacOS/BambuGo

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: BambuGo
          path: build/BambuGo.zip

      - name: Pubblica la release
        if: steps.version.outputs.value != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: BambuGo ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: build/BambuGo.zip
          generate_release_notes: true
